<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL 口播转录</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f1;font:16px Arial,"Microsoft YaHei";padding:20px}main{width:min(720px,100%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 40px #0001}h1{margin:0 0 8px}p{color:#666}label{display:block;font-weight:bold;margin:18px 0 8px}input,textarea{width:100%;padding:13px;border:1px solid #bbb;border-radius:10px;font:inherit}textarea{min-height:110px}button{margin:12px 8px 0 0;padding:11px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee}button:disabled{opacity:.5}#auth,#tool{display:none}#status,#result{margin-top:16px;padding:13px;border-radius:10px;background:#f6f6f3}#result{min-height:170px;white-space:pre-wrap;line-height:1.7}.error{color:#a00000;background:#fff0f0!important}small{color:#777}</style></head><body><main><h1>URL 口播转录</h1><p>粘贴 TikTok、YouTube 或公开音视频链接，自动识别语言。</p><section id="auth"><form id="loginForm"><label>访问密码</label><input id="password" type="password" required><button id="login" class="primary">进入工具</button></form><small>密码仅保存在本次浏览器会话中。</small></section><section id="tool"><form id="form"><label>视频或音频 URL</label><textarea id="url" required></textarea><button id="submit" class="primary">开始识别</button><button id="copy" class="secondary" type="button">复制文案</button><button id="logout" class="secondary" type="button">退出</button></form><div id="meta"></div><div id="result">识别结果会显示在这里。</div></section><div id="status">正在检查服务……</div></main><script>const q=s=>document.querySelector(s),auth=q('#auth'),tool=q('#tool'),status=q('#status'),result=q('#result'),meta=q('#meta');let pw=sessionStorage.getItem('pw')||'';function gate(msg='请输入访问密码。',err=false){auth.style.display='block';tool.style.display='none';status.textContent=msg;status.classList.toggle('error',err)}function enter(){auth.style.display='none';tool.style.display='block';status.classList.remove('error');status.textContent='验证通过。每个 IP 每小时最多 10 次。'}async function verify(p){const r=await fetch('/api/verify-password',{method:'POST',headers:{'x-access-password':p}}),d=await r.json();if(!r.ok)throw Error(d.error||'验证失败')}async function init(){try{const s=await fetch('/api/status').then(r=>r.json());if(!s.ready)return gate('服务器环境变量尚未配置完整。',true);if(!pw)return gate();await verify(pw);enter()}catch{pw='';sessionStorage.removeItem('pw');gate('请输入访问密码。',true)}}q('#loginForm').onsubmit=async e=>{e.preventDefault();q('#login').disabled=true;try{await verify(q('#password').value);pw=q('#password').value;sessionStorage.setItem('pw',pw);q('#password').value='';enter()}catch(x){gate(x.message,true)}finally{q('#login').disabled=false}};q('#form').onsubmit=async e=>{e.preventDefault();const url=q('#url').value.trim();if(!url)return;q('#submit').disabled=true;status.classList.remove('error');status.textContent='正在识别，请稍候……';result.textContent='识别中……';meta.textContent='';try{const r=await fetch('/api/transcribe-url',{method:'POST',headers:{'content-type':'application/json','x-access-password':pw},body:JSON.stringify({url})}),d=await r.json();if(r.status===401){pw='';sessionStorage.removeItem('pw');return gate('密码错误，请重新输入。',true)}if(!r.ok)throw Error(d.message||d.error||'请求失败');status.textContent='识别完成。';meta.textContent=`检测语言：${d.languageCode||'未知'}${typeof d.languageProbability==='number'?`，置信度 ${(d.languageProbability*100).toFixed(1)}%`:''}${typeof d.durationSeconds==='number'?`，时长 ${d.durationSeconds.toFixed(1)} 秒`:''}`;result.textContent=d.text||'未识别到口播'}catch(x){status.classList.add('error');status.textContent='识别失败：'+x.message;result.textContent=''}finally{q('#submit').disabled=false}};q('#copy').onclick=async()=>{await navigator.clipboard.writeText(result.textContent);q('#copy').textContent='已复制';setTimeout(()=>q('#copy').textContent='复制文案',1200)};q('#logout').onclick=()=>{pw='';sessionStorage.removeItem('pw');gate()};init()</script></body></html>
