<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElevenLabs URL 口播转录</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f1; color: #171717; padding: 24px; }
    main { width: min(760px, 100%); background: #fff; border: 1px solid #deded8; border-radius: 20px; padding: 28px; box-shadow: 0 18px 60px rgba(0,0,0,.08); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { color: #666; margin: 0 0 24px; line-height: 1.6; }
    label { display: block; font-weight: 700; margin-bottom: 8px; }
    textarea { width: 100%; min-height: 110px; resize: vertical; padding: 14px; border: 1px solid #c9c9c2; border-radius: 12px; font: inherit; line-height: 1.5; }
    textarea:focus { outline: 2px solid #111; outline-offset: 2px; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    button { border: 0; border-radius: 10px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    #submit { background: #111; color: #fff; }
    #copy { background: #ecece7; color: #111; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin: 18px 0 0; padding: 12px 14px; background: #f6f6f3; border-radius: 10px; color: #555; }
    #meta { margin-top: 18px; color: #555; font-size: 14px; }
    #result { white-space: pre-wrap; min-height: 180px; margin-top: 10px; padding: 16px; border-radius: 12px; border: 1px solid #deded8; background: #fafaf8; line-height: 1.75; }
    .error { color: #a30000 !important; background: #fff0f0 !important; }
  </style>
</head>
<body>
  <main>
    <h1>URL 口播转录</h1>
    <p class="sub">粘贴 TikTok、YouTube 或公开音视频链接。Scribe v2 会自动识别语言并生成口播文案。</p>

    <form id="form">
      <label for="url">视频或音频 URL</label>
      <textarea id="url" placeholder="https://www.tiktok.com/@.../video/..." required></textarea>
      <div class="actions">
        <button id="submit" type="submit">开始识别</button>
        <button id="copy" type="button">复制文案</button>
      </div>
    </form>

    <div id="status">正在检查 API Key 配置……</div>
    <div id="meta"></div>
    <div id="result">识别结果会显示在这里。</div>
  </main>

  <script>
    const form = document.querySelector("#form");
    const urlInput = document.querySelector("#url");
    const submitButton = document.querySelector("#submit");
    const copyButton = document.querySelector("#copy");
    const statusBox = document.querySelector("#status");
    const metaBox = document.querySelector("#meta");
    const resultBox = document.querySelector("#result");

    async function checkStatus() {
      try {
        const response = await fetch("/api/status");
        const data = await response.json();
        statusBox.classList.toggle("error", !data.ready);
        statusBox.textContent = data.ready
          ? "API Key 已配置，可以开始识别。"
          : "尚未配置 API Key：请编辑项目中的 .env 文件，然后重启服务。";
      } catch {
        statusBox.classList.add("error");
        statusBox.textContent = "无法连接本地服务。";
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const url = urlInput.value.trim();
      if (!url) return;

      submitButton.disabled = true;
      statusBox.classList.remove("error");
      statusBox.textContent = "正在提交给 ElevenLabs，请稍候……";
      metaBox.textContent = "";
      resultBox.textContent = "识别中……";

      try {
        const response = await fetch("/api/transcribe-url", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || data.error || "请求失败");

        statusBox.textContent = "识别完成。";
        const confidence = typeof data.languageProbability === "number"
          ? `，置信度 ${(data.languageProbability * 100).toFixed(1)}%`
          : "";
        const duration = typeof data.durationSeconds === "number"
          ? `，时长 ${data.durationSeconds.toFixed(1)} 秒`
          : "";
        metaBox.textContent = `检测语言：${data.languageCode || "未知"}${confidence}${duration}`;
        resultBox.textContent = data.text || "未识别到口播内容。";
      } catch (error) {
        statusBox.classList.add("error");
        statusBox.textContent = `识别失败：${error.message}`;
        resultBox.textContent = "";
      } finally {
        submitButton.disabled = false;
      }
    });

    copyButton.addEventListener("click", async () => {
      await navigator.clipboard.writeText(resultBox.textContent || "");
      copyButton.textContent = "已复制";
      setTimeout(() => { copyButton.textContent = "复制文案"; }, 1200);
    });

    checkStatus();
  </script>
</body>
</html>
